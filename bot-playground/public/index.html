<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Simulasi AI Bot Natura</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    :root {
      --bg-gradient: linear-gradient(135deg, #1e1e2f, #2a2a40);
      --chat-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #4F46E5;
      --text-main: #f3f4f6;
      --bubble-bot: rgba(79, 70, 229, 0.2);
      --bubble-user: rgba(16, 185, 129, 0.2);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      height: 90vh;
    }
    
    .glass-panel {
      background: var(--chat-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    
    .chat-container {
      flex: 2;
    }
    
    .state-container {
      flex: 1;
      overflow-y: auto;
    }
    
    .header {
      padding-bottom: 15px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 15px;
    }
    
    .header h2 {
      font-weight: 600;
      font-size: 1.2rem;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 10px;
    }
    
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    
    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
      white-space: pre-wrap;
    }
    
    .message.bot {
      background: var(--bubble-bot);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      border: 1px solid rgba(79, 70, 229, 0.3);
    }
    
    .message.user {
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    
    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    input[type="text"] {
      flex: 1;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 14px 20px;
      border-radius: 30px;
      outline: none;
      font-family: inherit;
      transition: all 0.3s;
    }
    
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }
    
    button:hover { background: #4338ca; }
    button:active { transform: scale(0.95); }
    
    pre {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #a78bfa;
      overflow-x: auto;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-panel chat-container">
      <div class="header">
        <h2>Simulasi Chat AI - Natura</h2>
      </div>
      <div class="messages" id="messages">
        <div class="message bot">Sistem Bot berhasil dimuat. Silakan ketik pesan (Misal: "mau pesan black forest 1 buat besok").</div>
      </div>
      <form class="input-area" id="chat-form">
        <input type="text" id="chat-input" placeholder="Ketik pesan..." autocomplete="off">
        <button type="submit">Kirim</button>
      </form>
    </div>
    
    <div class="glass-panel state-container">
      <div class="header">
        <h2>Live JSON State</h2>
      </div>
      <pre id="json-state">
{
  "product": null,
  "quantity": null,
  "delivery_date": null,
  "delivery_address": null,
  "order_status": "draft"
}
      </pre>
    </div>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('messages');
    const stateDisplay = document.getElementById('json-state');

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.textContent = text;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      input.disabled = true;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: 'user123', text: text })
        });
        const data = await response.json();
        
        if (Array.isArray(data.reply)) {
            data.reply.forEach((msg, idx) => {
                setTimeout(() => appendMessage(msg, 'bot'), idx * 800); // jeda antar bubble agar natural
            });
        } else {
            appendMessage(data.reply, 'bot');
        }
        stateDisplay.textContent = JSON.stringify(data.state, null, 2);
      } catch (err) {
        appendMessage('Error: Server tidak merespon.', 'bot');
      }
      
      input.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
