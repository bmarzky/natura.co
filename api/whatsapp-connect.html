<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungkan WhatsApp — Natura House</title>
</head>

<body>

    <h1>Hubungkan WhatsApp Natura House</h1>

    <button id="connect-whatsapp" type="button" disabled>
        Hubungkan WhatsApp
    </button>

    <p id="status" aria-live="polite">
        Memuat...
    </p>

    <script>
        const APP_ID = "2142207263837515";
        const CONFIG_ID = "1744117243364052";

        const button = document.getElementById("connect-whatsapp");
        const status = document.getElementById("status");

        window.fbAsyncInit = function () {

            FB.init({
                appId: APP_ID,
                cookie: true,
                xfbml: false,
                version: "v26.0"
            });

            status.textContent =
                "Siap menghubungkan WhatsApp.";

            button.disabled = false;
        };

        async function exchangeAuthorizationCode(code) {

            try {

                status.textContent =
                    "Authorization berhasil. Memproses koneksi...";

                const response = await fetch(
                    "/api/whatsapp-exchange.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            code: code
                        })
                    }
                );

                const result = await response.json();

                if (response.ok && result.success) {

                    status.textContent =
                        "Koneksi WhatsApp berhasil diproses.";

                } else {

                    console.error(
                        "Token exchange failed:",
                        result
                    );

                    status.textContent =
                        "Gagal memproses koneksi WhatsApp.";
                }

            } catch (error) {

                console.error(
                    "Token exchange error:",
                    error
                );

                status.textContent =
                    "Terjadi kesalahan saat menghubungi server.";

            } finally {

                button.disabled = false;
            }
        }

        button.addEventListener("click", function () {

            status.textContent =
                "Membuka proses koneksi WhatsApp...";

            button.disabled = true;

            FB.login(
                function (response) {

                    if (
                        !response.authResponse ||
                        !response.authResponse.code
                    ) {

                        status.textContent =
                            "Proses dibatalkan atau authorization code tidak diterima.";

                        button.disabled = false;
                        return;
                    }

                    const code =
                        response.authResponse.code;

                    exchangeAuthorizationCode(code);

                },
                {
                    config_id: CONFIG_ID,

                    response_type: "code",

                    override_default_response_type: true,

                    extras: {
                        featureType:
                            "whatsapp_business_app_onboarding"
                    }
                }
            );
        });
    </script>

    <script>
        (function (d, s, id) {

            var js;
            var fjs = d.getElementsByTagName(s)[0];

            if (d.getElementById(id)) {
                return;
            }

            js = d.createElement(s);
            js.id = id;
            js.src =
                "https://connect.facebook.net/en_US/sdk.js";

            fjs.parentNode.insertBefore(js, fjs);

        })(document, "script", "facebook-jssdk");
    </script>

</body>

</html>
