<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungkan WhatsApp — Natura House</title>
</head>

<body>

    <h1>Hubungkan WhatsApp Natura House</h1>

    <button id="connect-whatsapp" type="button" disabled>
        Hubungkan WhatsApp
    </button>

    <p id="status" aria-live="polite">
        Memuat...
    </p>

    <script>
        const APP_ID = "2142207263837515";
        const CONFIG_ID = "1744117243364052";

        const button =
            document.getElementById("connect-whatsapp");

        const status =
            document.getElementById("status");

        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get("code");
            const error = urlParams.get("error");
            
            if (error) {
                status.textContent = "Proses dibatalkan atau terjadi kesalahan: " + error;
                button.disabled = false;
            } else if (code) {
                // Hapus code dari URL agar tidak terkirim ulang saat refresh
                window.history.replaceState({}, document.title, window.location.pathname);
                exchangeAuthorizationCode(code);
            } else {
                status.textContent = "Siap menghubungkan WhatsApp.";
                button.disabled = false;
            }
        });


        async function exchangeAuthorizationCode(code) {

            try {

                status.textContent =
                    "Authorization berhasil. Memproses koneksi...";

                const response = await fetch(
                    "/api/whatsapp-exchange.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            code: code
                        })
                    }
                );

                const result =
                    await response.json();

                console.log(
                    "Exchange response:",
                    result
                );

                if (response.ok && result.success) {

                    status.textContent =
                        "Koneksi WhatsApp berhasil diproses.";

                } else {

                    console.error(
                        "Token exchange failed:",
                        result
                    );

                    status.textContent =
                        "Gagal memproses koneksi WhatsApp.";
                }

            } catch (error) {

                console.error(
                    "Token exchange error:",
                    error
                );

                status.textContent =
                    "Terjadi kesalahan saat menghubungi server.";

            } finally {

                button.disabled = false;
            }
        button.addEventListener("click", function () {
            status.textContent = "Membuka proses koneksi WhatsApp...";
            button.disabled = true;

            const oauthUrl = "https://business.facebook.com/messaging/whatsapp/onboard/?app_id=2142207263837515&config_id=1744117243364052&extras=%7B%22sessionInfoVersion%22%3A%223%22%2C%22version%22%3A%22v4%22%7D";
            window.location.href = oauthUrl;
        });
    </script>
</body>

</html>
