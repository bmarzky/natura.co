<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungkan WhatsApp — Natura House</title>
</head>

<body>

    <h1>Hubungkan WhatsApp Natura House</h1>

    <button id="connect-whatsapp" type="button" disabled>
        Hubungkan WhatsApp
    </button>

    <p id="status" aria-live="polite">
        Memuat...
    </p>

    <script>
        const APP_ID = "2142207263837515";
        const CONFIG_ID = "1744117243364052";

        const button =
            document.getElementById("connect-whatsapp");

        const status =
            document.getElementById("status");

        window.fbAsyncInit = function() {
            FB.init({
                appId            : APP_ID,
                autoLogAppEvents : true,
                cookie           : true,
                xfbml            : true,
                version          : 'v26.0'
            });
            status.textContent = "Siap menghubungkan WhatsApp.";
            button.disabled = false;
        };


        async function exchangeAuthorizationCode(code) {

            try {

                status.textContent =
                    "Authorization berhasil. Memproses koneksi...";

                const response = await fetch(
                    "/api/whatsapp-exchange.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            code: code
                        })
                    }
                );

                const result =
                    await response.json();

                console.log(
                    "Exchange response:",
                    result
                );

                if (response.ok && result.success) {

                    status.textContent =
                        "Koneksi WhatsApp berhasil diproses.";

                } else {

                    console.error(
                        "Token exchange failed:",
                        result
                    );

                    status.textContent =
                        "Gagal memproses koneksi WhatsApp.";
                }

            } catch (error) {

                console.error(
                    "Token exchange error:",
                    error
                );

                status.textContent =
                    "Terjadi kesalahan saat menghubungi server.";

            } finally {

                button.disabled = false;
            }
        }

        const fbLoginCallback = (response) => {
            if (response.authResponse && response.authResponse.code) {
                const code = response.authResponse.code;
                exchangeAuthorizationCode(code);
            } else {
                status.textContent = "Proses dibatalkan atau authorization code tidak diterima.";
                button.disabled = false;
            }
        };

        const launchWhatsAppSignup = () => {
            status.textContent = "Membuka proses koneksi WhatsApp...";
            button.disabled = true;

            FB.login(fbLoginCallback, {
                config_id: CONFIG_ID,
                response_type: 'code',
                override_default_response_type: true,
                redirect_uri: "https://natura-house.shop/api/whatsapp-connect.html",
                extras: {"version":"v4"}
            });
        };

        button.addEventListener("click", launchWhatsAppSignup);
    </script>

    <!-- Facebook JavaScript SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</body>

</html>
