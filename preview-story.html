<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Desain Story - Natura House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px;
    }

    .preview-container {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
      /* Skala untuk layar kecil agar tetap terlihat utuh */
      transform: scale(0.9);
    }
  </style>
</head>

<body>

  <!-- Ini adalah replika murni dari template yang ada di index.html -->
  <div class="preview-container">
    <div id="storyTemplate"
      style="position: relative; width: 540px; height: 960px; background-color: #0b1711; background-image: radial-gradient(circle at 100% 0%, rgba(155, 130, 92, 0.15) 0%, transparent 60%), radial-gradient(circle at 0% 100%, rgba(155, 130, 92, 0.1) 0%, transparent 50%); color: #D9D7D2; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; box-sizing: border-box; text-align: center; overflow: hidden; box-shadow: inset 0 0 100px rgba(0,0,0,0.5);">

      <!-- Outer Fine Line Borders (Double frame) -->
      <div
        style="position: absolute; top: 16px; left: 16px; right: 16px; bottom: 16px; border: 1px solid rgba(155, 130, 92, 0.25); pointer-events: none; z-index: 1;">
      </div>
      <div
        style="position: absolute; top: 22px; left: 22px; right: 22px; bottom: 22px; border: 1px solid rgba(155, 130, 92, 0.1); pointer-events: none; z-index: 1;">
      </div>

      <!-- Botanical Background Leaf Line Art -->
      <img src="assets/images/leaf-bg.png" style="position: absolute; top: 22px; left: 22px; width: 496px; height: 916px; object-fit: cover; opacity: 0.04; mix-blend-mode: lighten; pointer-events: none; z-index: 1;" alt="Leaf Background">

      <!-- Header -->
      <div style="position: absolute; top: 80px; z-index: 2; width: 100%; text-align: center;">
        <h1
          style="font-family: 'Playfair Display', serif; font-size: 2.6rem; font-weight: 400; font-style: italic; color: #9B825C; margin: 0; letter-spacing: 2px;">
          natura house</h1>
        <div style="width: 40px; height: 1px; background-color: #9B825C; margin: 16px auto;"></div>
        <p
          style="font-family: 'Montserrat', sans-serif; font-size: 0.85rem; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(217, 215, 210, 0.5); margin: 0;">
          review pelanggan</p>
      </div>

      <!-- Main Quote Section -->
      <div style="z-index: 2; width: 100%; padding: 0 40px; margin-top: 20px; text-align: center;">

        <!-- Stars -->
        <div id="storyStars" style="display: flex; justify-content: center; gap: 8px; margin-bottom: 40px;">
          <!-- SVG stars injected here -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#9B825C">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
          </svg>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#9B825C">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
          </svg>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#9B825C">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
          </svg>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#9B825C">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
          </svg>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#9B825C">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
          </svg>
        </div>

        <!-- Quote -->
        <div style="position: relative; display: inline-block; max-width: 100%;">
          <blockquote id="storyText"
            style="font-family: 'Montserrat', sans-serif; font-style: normal; font-size: 1.7rem; font-weight: 300; line-height: 1.6; margin: 0; color: #D9D7D2; position: relative; z-index: 2;">
            “rasanya enak”
          </blockquote>
        </div>

        <!-- Name -->
        <div
          style="font-family: 'Montserrat', sans-serif; font-size: 1.1rem; letter-spacing: 0.10em; color: #9B825C; margin-top: 60px; text-transform: uppercase; font-weight: 500;">
          <span id="storyName">mifta</span>
        </div>
      </div>

      <!-- Footer -->
      <div
        style="position: absolute; bottom: 70px; z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="width: 1px; height: 50px; background-color: rgba(155, 130, 92, 0.3); margin-bottom: 20px;"></div>
        <div
          style="font-family: 'Montserrat', sans-serif; font-size: 1.1rem; opacity: 0.7; letter-spacing: 0.15em; display: flex; align-items: center; justify-content: center; gap: 10px; color: #D9D7D2; text-transform: lowercase;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm7.5-6.923c-.67.204-1.335.82-1.887 1.855A7.97 7.97 0 0 0 5.145 4H7.5V1.077zM4.09 4a9.267 9.267 0 0 1 .64-1.539 6.7 6.7 0 0 1 .597-.933A7.025 7.025 0 0 0 2.255 4H4.09zm-.582 3.5c.03-.877.138-1.718.312-2.5H1.674a6.958 6.958 0 0 0-.656 2.5h2.49zM4.847 5a12.5 12.5 0 0 0-.338 2.5H7.5V5H4.847zM8.5 5v2.5h2.99a12.495 12.495 0 0 0-.337-2.5H8.5zM4.51 8.5a12.5 12.5 0 0 0 .337 2.5H7.5V8.5H4.51zm3.99 0V11h2.653c.187-.765.306-1.608.338-2.5H8.5zM5.145 12c.138.386.295.744.468 1.068.552 1.035 1.218 1.65 1.887 1.855V12H5.145zm.182 2.472a6.696 6.696 0 0 1-.597-.933A9.268 9.268 0 0 1 4.09 12H2.255a7.024 7.024 0 0 0 3.072 2.472zM3.82 11a13.652 13.652 0 0 1-.312-2.5h-2.49c.062.89.291 1.733.656 2.5H3.82zm6.853 3.472A7.024 7.024 0 0 0 13.745 12H11.91a9.27 9.27 0 0 1-.64 1.539 6.688 6.688 0 0 1-.597.933zM8.5 12v2.923c.67-.204 1.335-.82 1.887-1.855.173-.324.33-.682.468-1.068H8.5zm3.68-1h2.146c.365-.767.594-1.61.656-2.5h-2.49a13.65 13.65 0 0 1-.312 2.5zm2.802-3.5a6.959 6.959 0 0 0-.656-2.5H12.18c.174.782.282 1.623.312 2.5h2.49zM11.27 2.461c.247.464.462.98.64 1.539h1.835a7.024 7.024 0 0 0-3.072-2.472c.218.284.418.598.597.933zM10.855 4c-.173-.386-.33-.744-.468-1.068C9.835 1.897 9.17 1.282 8.5 1.077V4h2.355z"/>
          </svg>
          https://natura-house.shop/
        </div>
      </div>

    </div>
  </div>
</body>

</html>
