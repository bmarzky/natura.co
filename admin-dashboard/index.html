<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natura House - Admin Dashboard</title>
    <!-- Tailwind CSS untuk Desain yang Cantik -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Desain Scrollbar Custom agar terlihat rapi */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden flex">

    <!-- Sidebar: Daftar Pelanggan -->
    <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col h-full">
        <div class="p-4 bg-emerald-600 text-white font-bold text-lg flex items-center justify-between">
            <span>Natura Admin Panel</span>
            <button onclick="loadCustomers()" class="text-xs bg-emerald-500 px-2 py-1 rounded hover:bg-emerald-400">Refresh</button>
        </div>
        <div class="p-3 bg-gray-50 border-b text-sm text-gray-500">
            Daftar Pelanggan Terbaru
        </div>
        <div id="customer-list" class="flex-1 overflow-y-auto">
            <!-- Daftar pelanggan akan di-load di sini -->
            <div class="p-4 text-center text-gray-400 text-sm">Memuat data...</div>
        </div>
    </div>

    <!-- Area Obrolan -->
    <div class="flex-1 flex flex-col h-full bg-slate-50 relative">
        <!-- Header Obrolan -->
        <div id="chat-header" class="p-4 bg-white border-b border-gray-200 flex items-center shadow-sm z-10 hidden">
            <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-bold mr-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div>
                <h2 id="active-phone" class="font-bold text-gray-800">Pilih Pelanggan</h2>
                <p class="text-xs text-green-500">Mode Admin Aktif</p>
            </div>
        </div>

        <!-- Ruang Obrolan -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="h-full flex items-center justify-center text-gray-400">
                Silakan pilih pelanggan dari menu di sebelah kiri.
            </div>
        </div>

        <!-- Input Pesan -->
        <div id="chat-input-area" class="p-4 bg-white border-t border-gray-200 hidden">
            <div class="flex items-end bg-gray-100 rounded-lg p-1">
                <textarea id="message-input" rows="1" class="flex-1 bg-transparent p-3 outline-none resize-none" placeholder="Ketik balasan untuk pelanggan..."></textarea>
                <button onclick="sendMessage()" class="m-2 p-2 bg-emerald-600 text-white rounded-full hover:bg-emerald-700 transition transform hover:scale-105">
                    <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI DARI .ENV ANDA ---
        const SUPABASE_URL = "https://loorhxkfmhdljqxollzh.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxvb3JoeGtmbWhkbGpxeG9sbHpoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDYxNzIzMSwiZXhwIjoyMTA2MTkzMjMxfQ.xYgLFgcfLi8bT-4uP73mw_CFpNHZfjsG05HlsxEwroU";
        
        const META_TOKEN = "EAAXSP4fgN0ABSuwHegYvWZCtrOsZBR5vz6veZBkuj0GnkZA0h8wGNRlXBZAQvDXU8lYMDZBkB5ZBpsdKZAzZATZA4pzOQ9sdbgVjOCfOiqET6RSFV9cNZAJjrTY7JoIkYZCLZBxDiBGuouECJ8eHxZCmlWs6qxt8fXjZCvedZBrX6cjDJ5h93mFTXMHRbvKwd2SpZBNZBadZCZABaQZDZD";
        const META_PHONE_ID = "1394926080368074";
        
        // Inisialisasi Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentPhone = null;

        // Memuat daftar nomor HP unik dari database Supabase
        async function loadCustomers() {
            const listEl = document.getElementById('customer-list');
            listEl.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">Menarik data pelanggan...</div>';
            
            // Ambil semua percakapan, urutkan dari yang terbaru
            const { data, error } = await supabaseClient
                .from('bot_chats')
                .select('phone, created_at')
                .order('created_at', { ascending: false });
                
            if (error) {
                listEl.innerHTML = `<div class="p-4 text-red-500 text-sm">Error: ${error.message}</div>`;
                return;
            }

            // Cari nomor-nomor yang unik (menghilangkan duplikat)
            const uniquePhones = [];
            const seen = new Set();
            for (let row of data) {
                if (!seen.has(row.phone)) {
                    seen.add(row.phone);
                    uniquePhones.push(row);
                }
            }

            if (uniquePhones.length === 0) {
                listEl.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">Belum ada percakapan.</div>';
                return;
            }

            // Render ke Sidebar
            let html = '';
            uniquePhones.forEach(u => {
                const isSelected = currentPhone === u.phone ? 'bg-emerald-50 border-l-4 border-emerald-500' : 'hover:bg-gray-100';
                html += `
                    <div onclick="openChat('${u.phone}')" class="p-4 cursor-pointer border-b ${isSelected} transition">
                        <div class="font-bold text-gray-800">${u.phone}</div>
                        <div class="text-xs text-gray-400 mt-1">Chat Terakhir: ${new Date(u.created_at).toLocaleTimeString('id-ID')}</div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // Membuka percakapan untuk nomor tertentu
        async function openChat(phone) {
            currentPhone = phone;
            document.getElementById('active-phone').innerText = phone;
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            
            // Render ulang sidebar agar nomor yang terpilih berubah warna
            loadCustomers();

            const boxEl = document.getElementById('chat-box');
            boxEl.innerHTML = '<div class="text-center text-gray-400 text-sm mt-10">Memuat percakapan...</div>';

            // Ambil riwayat percakapan dari Supabase
            const { data, error } = await supabaseClient
                .from('bot_chats')
                .select('*')
                .eq('phone', phone)
                .order('created_at', { ascending: true });

            if (error) {
                boxEl.innerHTML = `<div class="text-center text-red-500 mt-10">Gagal memuat: ${error.message}</div>`;
                return;
            }

            boxEl.innerHTML = '';
            
            // Render setiap balon chat
            data.forEach(msg => {
                let text = msg.content;
                // Jika pesannya berupa JSON (dari AI), kita coba ambil teks balasannya saja
                try {
                    const parsed = JSON.parse(text);
                    if (parsed.reply) {
                        text = Array.isArray(parsed.reply) ? parsed.reply.join("<br><br>") : parsed.reply;
                    }
                } catch (e) {}

                // Buat elemen gelembung
                const div = document.createElement('div');
                div.className = `flex ${msg.role === 'user' ? 'justify-start' : 'justify-end'}`;
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-[70%] p-3 rounded-2xl shadow-sm text-sm ${
                    msg.role === 'user' 
                    ? 'bg-white text-gray-800 rounded-tl-none border border-gray-100' 
                    : 'bg-emerald-100 text-emerald-900 rounded-tr-none'
                }`;
                // Konversi enter menjadi br
                bubble.innerHTML = text.replace(/\n/g, '<br>');

                div.appendChild(bubble);
                boxEl.appendChild(div);
            });

            // Scroll otomatis ke paling bawah
            scrollToBottom();
        }

        function scrollToBottom() {
            const boxEl = document.getElementById('chat-box');
            boxEl.scrollTop = boxEl.scrollHeight;
        }

        // Mengirim balasan langsung ke Meta API
        async function sendMessage() {
            if (!currentPhone) return;
            
            const inputEl = document.getElementById('message-input');
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = ''; // Kosongkan input
            
            // Render langsung ke layar (Optimistic UI)
            const boxEl = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'flex justify-end mb-4';
            div.innerHTML = `<div class="max-w-[70%] p-3 rounded-2xl rounded-tr-none shadow-sm text-sm bg-emerald-100 text-emerald-900 opacity-70">${text.replace(/\n/g, '<br>')} <span class="text-xs text-emerald-600 block text-right mt-1">Mengirim...</span></div>`;
            boxEl.appendChild(div);
            scrollToBottom();

            try {
                // [MODE SIMULASI] 1. Tembak Meta API dimatikan sementara agar tidak error saat simulasi lokal
                /*
                const response = await fetch(`https://graph.facebook.com/v20.0/${META_PHONE_ID}/messages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${META_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messaging_product: 'whatsapp',
                        recipient_type: 'individual',
                        to: currentPhone,
                        type: 'text',
                        text: { body: text }
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || "Gagal mengirim ke Meta");
                }
                */

                // 2. Simpan pesan admin ke Supabase agar tersimpan di histori
                await supabaseClient.from('bot_chats').insert({
                    phone: currentPhone,
                    role: 'assistant',
                    content: text // Simpan teks admin
                });

                // Tarik ulang chat untuk memastikan sinkron
                openChat(currentPhone);

            } catch (err) {
                alert("Gagal mengirim pesan: " + err.message);
                div.remove(); // Hapus pesan pura-pura jika gagal
            }
        }

        // Handle tombol Enter untuk mengirim
        document.getElementById('message-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Load data pertama kali
        loadCustomers();
    </script>
</body>
</html>
